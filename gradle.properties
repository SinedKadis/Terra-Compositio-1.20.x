# Sets default memory used for Gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true


## Environment Properties
#mixin.disableRefMap=true
# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.21.2)
# The NeoForge version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.234
# The NeoForge version range can only use the major version of NeoForge/FML as bounds
neo_version_range=[21.1.0,)
# The loader version range can only use the major version of NeoForge/FML as bounds
loader_version_range=[1,)

# NeoGradle's built-in Parchment support (replaces the old ForgeGradle "mapping_channel"/"mapping_version"
# properties and the org.parchmentmc.librarian.forgegradle plugin, neither of which exist under NeoGradle).
# See https://parchmentmc.org/docs/getting-started for the list of available versions per Minecraft version.
# NOTE: parchment-1.21.1 currently only has one published mapping set (2024.11.17).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Dependency properties
# JEI 19.27.0.336 is the latest release published for NeoForge 1.21.1
jei_version=19.27.0.336

# Mekanism has no published NeoForge 1.21.1 build at the time of writing.
# Left here commented out for reference; the dependency itself stays disabled in build.gradle.
#mekanism_version=1.20.1-10.4.0.14

# Create + friends: versions taken from the official Create wiki NeoForge 1.21.1 dependency page
# https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# TerraBlender (NeoForge build), latest release for 1.21.1
terrablender_version=4.1.0.8
terrablender_version_range=[4.1.0,)


# Curios API, latest release for NeoForge 1.21.1
curios_version=9.5.1+1.21.1

# Patchouli, latest NeoForge release for 1.21.1
patchouli_version=1.21.1-93-NEOFORGE

# MixinExtras: NeoForge already bundles the runtime jar (has done since NeoForge 20.2.84+),
# this version is only used for the annotationProcessor at compile time.
# https://github.com/LlamaLad7/MixinExtras
mixinextras_version=0.5.4

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=terracompositio
# The human-readable display name for the mod.
mod_name=Terra Compositio
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=net.sinedkadis.terracompositio
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=SinedKadis
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=This is a mod based on the magic of the earth, which aims to add multifunctional armor and tools to the game, as well as weapons, various decorative and not only accessories.