//file:noinspection GroovyAssignabilityCheck
//file:noinspection DependencyNotationArgument
buildscript {
    dependencies {
        classpath 'org.slf4j:slf4j-simple:1.7.36'
    }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // NeoGradle replaces the old net.minecraftforge.gradle ForgeGradle plugin.
    // org.parchmentmc.librarian.forgegradle is NOT used anymore: NeoGradle reads Parchment
    // settings directly from gradle.properties (neogradle.subsystems.parchment.*).
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    // NOTE: 'org.spongepowered.mixin' is intentionally NOT applied here. That plugin is
    // ForgeGradle-only tooling: on apply it reaches for ForgeGradle's `reobf` extension to hook
    // mixin-config registration into the reobfJar task, which does not exist under NeoGradle
    // ("Could not get unknown property 'reobf'"). NeoGradle generates the mixin refmap
    // automatically on its own; you only need to list your mixin config file under `[[mixins]]`
    // in src/main/resources/META-INF/neoforge.mods.toml, e.g.:
    //   [[mixins]]
    //   config = "mixins.terracompositio.json"
    //id 'io.freefair.lombok' version '8.6'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)


repositories {
    mavenCentral()
    // Put repositories for dependencies here
    // NeoGradle automatically adds the NeoForged maven and Maven Central for you
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
    maven {
        url 'https://modmaven.dev/'
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    // Create, Ponder and Flywheel are all published here for NeoForge builds as well.
    maven { url = "https://maven.createmod.net" }
    // Registrate moved off maven.tterrag.com for its NeoForge builds and now lives here.
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // Mirror used for TerraBlender's NeoForge artifacts.
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
}




sourceSets {
    createcompat {
        java.srcDir 'src/createcompat/java'
        //resources.srcDir 'src/main/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // Mappings are NOT configured here under NeoGradle.
    // ForgeGradle used `mappings channel: mapping_channel, version: mapping_version`, but that
    // property does not exist on NeoGradle's minecraft{} extension at all. Parchment mappings
    // are instead picked up automatically from gradle.properties:
    //   neogradle.subsystems.parchment.minecraftVersion
    //   neogradle.subsystems.parchment.mappingsVersion
    // See https://docs.neoforged.net/toolchain/docs/parchment/ for details.

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // NOTE: "copyIdeResources" from the ForgeGradle template does not exist on NeoGradle; resource
    // processing for IDE runs is handled automatically instead, so it has simply been dropped here.

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            systemProperty 'forge.logging.console.level', 'debug'

            // NeoGradle's DSL for attaching source sets to a run replaces ForgeGradle's
            // `mods { "${mod_id}" { source sourceSets.main } }` block. Call modSource once per
            // source set that should be loaded as part of this mod.
            modSource project.sourceSets.main
            modSource project.sourceSets.createcompat

            // The old `mixin.env.remapRefMap` / `mixin.env.refMapRemappingFile` properties pointed
            // at a `createSrgToMcp/output.srg` file. NeoForge no longer has an SRG mapping stage
            // (everything uses official Mojang mappings directly), so that file never gets
            // generated under NeoGradle and these properties have been removed.
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            //jvmArgs += "-Dfml.earlyprogresswindow=false"
        }

        server {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            argument '--nogui'
            //jvmArgs += "-Dfml.earlyprogresswindow=false"
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the mod_id for data generation, where to output the resulting resource, and where to look for existing resources.
            // NeoGradle uses `arguments.addAll` here instead of ForgeGradle's `args`.
            // (getProgramArguments() is deprecated as of NeoGradle 7.1 in favor of getArguments().)
            arguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// Access transformers use a different entry point under NeoGradle than ForgeGradle's
// `accessTransformer = file(...)` inside the minecraft{} block.
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {

    implementation "net.neoforged:neoforge:${neo_version}"

    // NeoForge has bundled the MixinExtras runtime jar since 20.2.84+, so only the
    // annotationProcessor is needed here for the extra injector annotations at compile time.
    // https://github.com/LlamaLad7/MixinExtras
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    // Mixin itself: NeoForge already bundles a Mixin runtime, but the annotation processor is
    // still needed at compile time to process your @Mixin classes. No separate Gradle plugin
    // or refmap task is needed anymore (see the note next to the plugins block above).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // NeoGradle dependencies no longer need to be wrapped in `fg.deobf(...)`: that ForgeGradle
    // helper doesn't exist under NeoGradle's userdev plugin, and it isn't needed anymore since
    // everything is published against official Mojang mappings directly.

    // Patchouli publishes a NeoForge build for 1.21.1.
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"

    // --- Botania -----------------------------------------------------------------------------
    // Botania currently has NO published NeoForge build at all (it is still on Forge 1.20.1 as of
    // this writing). The old `vazkii.botania:Botania:1.20.1-453-FORGE` coordinate simply does not
    // exist for NeoForge 1.21.1, so the dependency has been disabled below. Check
    // https://www.curseforge.com/minecraft/mc-mods/botania/files for an updated NeoForge release
    // before re-enabling this.
    // compileOnly "vazkii.botania:Botania:${botania_version}:api"
    // runtimeOnly "vazkii.botania:Botania:${botania_version}"

    // Compile against only the API artifact
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Use the full Curios API jar at runtime
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    // testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

//    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
//
//    // If you want to test/use Mekanism & its modules during `runClient` invocation, use the following
//    runtimeOnly "mekanism:Mekanism:${mekanism_version}:all"// core
//    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:generators"// Mekanism: Generators
//    // NOTE: no published NeoForge 1.21.1 build was found for Mekanism either - verify before enabling.

    // Versions and coordinates below match the official Create wiki NeoForge 1.21.1 dependency guide:
    // https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    createcompatCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    //implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    implementation "maven.modrinth:kkmrDlKT:6e8GCrLb"
}

// NOTE: there is no `mixin { ... }` configuration block anymore (that came from the
// org.spongepowered.mixin Gradle plugin, which isn't applied - see the note by the plugins block).
// The refmap (terracompositio.refmap.json) is generated automatically by NeoGradle. Make sure
// your mixin config file is still listed in src/main/resources/mixins.terracompositio.json,
// referenced from a `[[mixins]]` table in META-INF/neoforge.mods.toml, e.g.:
//   [[mixins]]
//   config = "mixins.terracompositio.json"

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version         : minecraft_version,
            minecraft_version_range   : minecraft_version_range,
            neo_version               : neo_version,
            neo_version_range         : neo_version_range,
            loader_version_range      : loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description,
            terrablender_version_range: terrablender_version_range,
    ]
    inputs.properties replaceProperties

    // NeoForge's mod metadata file is named neoforge.mods.toml (ForgeGradle's was mods.toml).
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}


// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // NeoGradle's userdev plugin already produces a correctly remapped jar; there is no separate
    // "reobfJar" task to finalize by like there was under ForgeGradle, so nothing further is needed.
}


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveBaseName.set(mod_id)
    archiveVersion.set("${minecraft_version}-${mod_version}")
}

jar {
    from sourceSets.createcompat.output
}


configurations {
    // `mixinAnnotation` no longer exists: it was created by the org.spongepowered.mixin Gradle
    // plugin, which isn't applied anymore (see the note by the plugins block).

    createcompatImplementation.extendsFrom implementation
    createcompatCompileOnly.extendsFrom compileOnly
}